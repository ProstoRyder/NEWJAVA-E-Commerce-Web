name: Lab 4 Grading

on:
  push:
    branches:
      - lab4
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Helm grading script
        run: |
          chmod +x ./tests/lab4_test.sh
          ./tests/lab4_test.sh
