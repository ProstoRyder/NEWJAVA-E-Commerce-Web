replicaCount: 2

image:
  repository: ecommerce-app
  tag: lab3
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

postgres:
  image: postgres:16-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

service:
  type: ClusterIP
  port: 8080

postgresService:
  type: ClusterIP
  port: 5432

config:
  dbHost: postgres
  dbPort: "5432"
  dbName: ecommerce
  dbUser: postgres

secret:
  dbPassword: postgres
